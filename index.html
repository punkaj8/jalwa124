<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSR Web Developer - Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 20px; color: #38bdf8; letter-spacing: 1px; }
        .header p { font-size: 13px; color: #94a3b8; }
        .title { text-align: center; margin-bottom: 20px; }
        .title h2 { font-size: 24px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #0369a1; }
        .whatsapp-card { margin-top: 25px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 15px; text-align: center; }
        .whatsapp-card h4 { color: #22c55e; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .whatsapp-card p { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .btn-whatsapp { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 10px; padding: 10px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #64748b; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .switch-link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JSR WEB DEVELOPER</h1>
            <p>Admin Control Panel</p>
        </div>
        <div class="title">
            <h2>Welcome Back</h2>
            <p style="font-size: 13px; color: #94a3b8;">Sign in to your account</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / Phone</label>
                <input type="text" id="username" placeholder="Enter username or phone" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="switch-link">
            New user? <a href="register.html">Register here</a>
        </div>

        <div class="whatsapp-card">
            <h4><i class="fab fa-whatsapp"></i> Contact Us on WhatsApp</h4>
            <p>For immediate assistance or new website inquiries</p>
            <p><strong>📱 +91 8090948616</strong></p>
            <p>⏰ Available: Mon-Sun, 9AM - 9PM</p>
            <a href="https://wa.me/918090948616" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Message for New Website
            </a>
        </div>
        <div class="footer">© 2026 VERSE DKH — Secured Panel</div>
    </div>
</body>
</html>
